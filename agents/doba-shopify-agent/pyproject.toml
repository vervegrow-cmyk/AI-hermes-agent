[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doba-shopify-agent"
version = "0.1.0"
description = "Doba product evaluation and Shopify draft publishing agent."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "openai>=1.93.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "pytest>=8.4.1",
  "python-dotenv>=1.1.1",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["bootstrap", "main"]

[tool.setuptools.packages.find]
include = ["api*", "models*", "service*", "src*", "workflow*"]
