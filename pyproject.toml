[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hermes-agent"
version = "0.1.0"
description = "Unified AI agent development platform for Hermes agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.55.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "fastmcp>=2.12.0",
  "google-genai>=1.23.0",
  "httpx>=0.28.1",
  "openai>=1.93.0",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pytest>=8.4.1",
  "python-dotenv>=1.1.1",
  "qdrant-client>=1.14.2",
  "redis>=6.2.0",
  "sqlalchemy>=2.0.41",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "agents", "templates"]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.ruff]
line-length = 100
