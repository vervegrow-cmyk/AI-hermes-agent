upstream hermes_agents {
    server trend-agent:8081;
    server content-agent:8082;
    server shopify-agent:8083;
    server analytics-agent:8084;
}

server {
    listen 80;

    location /trend/ {
        proxy_pass http://trend-agent:8081/;
    }

    location /content/ {
        proxy_pass http://content-agent:8082/;
    }

    location /shopify/ {
        proxy_pass http://shopify-agent:8083/;
    }

    location /analytics/ {
        proxy_pass http://analytics-agent:8084/;
    }

    location /trendforge/ {
        proxy_pass http://hermes-trendforge-agent:8085/;
    }

    location /shopify-category/ {
        proxy_pass http://shopify-category-agent:8088/;
    }
}
